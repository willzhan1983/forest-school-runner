<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>森林学校大冒险 · Forest School Runner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%B0</text></svg>">
<!--
  ============================================================
  如何把占位角色换成你真实的 IP 形象图片
  ============================================================
  目前两个角色都用 Canvas 程序绘制（drawCatSprite / drawOwlSprite）。
  换成真实素材的两种方式：

  方式 A（推荐，保持图片内嵌）：
    1. 终端执行： base64 -i cat.png | pbcopy
    2. 在 js/game.js 的 CHARACTERS 对应角色里加 spriteSrc: "data:image/png;base64,粘贴内容"
    3. 代码会自动改用 drawImage 绘制，并保留跑动/跳跃/滑铲形变动画。

  方式 B（图片放同目录）：
    把 cat.png / owl.png 与本 html 放同一目录，
    在 CHARACTERS 里写 spriteSrc: "cat.png"。

  角色配色可在 CHARACTERS.colors 里直接微调。
  ============================================================
-->
<link rel="stylesheet" href="css/game.css?v=audit-20261014">
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="tip">
  <strong>横过手机，冒险更清楚</strong>
  <span id="tipText">点下方按钮尝试横屏全屏；如果没有自动旋转，请手动横过手机。</span>
  <button id="fsBtn">横屏全屏玩</button>
  <button id="closeTip" class="alt">暂时继续</button>
</div>
<input type="file" id="picInput" accept="image/*" style="display:none">
<div id="assetStatus" role="status" aria-live="polite" hidden>网络不佳，已切换为简版画面</div>
<script src="js/tuning.js?v=audit-20261014"></script>
<script src="js/config.js?v=audit-20261014"></script>
<script src="js/audio.js?v=audit-20261014"></script>
<script src="js/asset-loader.js?v=audit-20261014"></script>
<script src="js/game.js?v=glide-20261014"></script>
</body>
</html>
